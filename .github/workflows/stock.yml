name: Monitor ETB 30 Aniversario

on:
  schedule:
    # Cada 10 min, en minutos "5,15,..." para evitar el filo de la hora (mas saturado).
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:   # permite lanzarlo a mano desde la pestana Actions

permissions:
  contents: write      # necesario para guardar state.json de vuelta en el repo

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_stock.py

      - name: Generar panel e historico
        run: python -u panel.py

      - name: Resumen diario (bajadas de precio)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u resumen_diario.py
        
      - name: Latido diario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u latido.py
        
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar estado, panel y resumen [skip ci]"
            git push
          fi
